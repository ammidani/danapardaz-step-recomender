<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ابزار پیشنهاد محصولات داناپرداز</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="dp-container">
        <style>
            #dp-container {
                font-family: 'Vazirmatn', sans-serif;
                direction: rtl;
                text-align: right;
                background-color: #f9f9f9;
                color: #333;
                padding: 20px;
                border-radius: 8px;
                max-width: 800px;
                margin: 20px auto;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            }
            #dp-container h1, #dp-container h2, #dp-container h3 {
                color: #0D2E4E;
            }
            #dp-container .dp-step {
                display: none;
            }
            #dp-container .dp-step.active {
                display: block;
            }
            #dp-container .dp-button {
                background-color: #FB8230;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 5px;
                cursor: pointer;
                font-size: 16px;
                margin-top: 10px;
                transition: background-color 0.3s;
            }
            #dp-container .dp-button:hover {
                background-color: #e07029;
            }
            #dp-container .dp-input {
                width: 100%;
                padding: 10px;
                margin-bottom: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                box-sizing: border-box;
            }
            #dp-container .dp-options label {
                display: block;
                margin-bottom: 10px;
            }
            #dp-container .dp-result {
                background-color: #fff;
                padding: 20px;
                border-radius: 5px;
                margin-top: 20px;
                border: 1px solid #eee;
            }
            #dp-admin-panel {
                display: none;
                margin-top: 30px;
                padding-top: 20px;
                border-top: 1px solid #ccc;
            }
            @media (max-width: 600px) {
                #dp-container {
                    padding: 15px;
                }
            }
        </style>

        <div id="dp-wizard">
            <!-- Steps will be injected here by JavaScript -->
        </div>

        <div id="dp-result" class="dp-result" style="display: none;">
            <h3>پیشنهاد ما برای شما:</h3>
            <p id="dp-ai-response"></p>
        </div>

        <div id="dp-lead-form" style="display: none;">
            <h3>برای دریافت مشاوره رایگان اطلاعات خود را وارد کنید</h3>
            <input type="text" id="dp-name" class="dp-input" placeholder="نام و نام خانوادگی">
            <input type="email" id="dp-email" class="dp-input" placeholder="ایمیل">
            <input type="tel" id="dp-phone" class="dp-input" placeholder="شماره تماس">
            <button id="dp-submit-lead" class="dp-button">ارسال</button>
        </div>

        <button id="dp-admin-toggle" class="dp-button" style="background-color: #0D2E4E; margin-top: 20px;">تنظیمات مدیر</button>

        <div id="dp-admin-panel">
            <h3>تنظیمات اتصال به سرویس هوش مصنوعی</h3>
            <label for="dp-ai-provider">سرویس دهنده:</label>
            <select id="dp-ai-provider" class="dp-input">
                <option value="gemini">Gemini</option>
                <option value="qwen">Qwen</option>
                <option value="openrouter">OpenRouter</option>
                <option value="custom">Custom</option>
            </select>
            <input type="text" id="dp-api-key" class="dp-input" placeholder="API Key">
            <input type="text" id="dp-api-url" class="dp-input" placeholder="API URL (برای Custom)">
            <button id="dp-test-connection" class="dp-button">تست اتصال</button>
            <p id="dp-connection-status"></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const wizard = document.getElementById('dp-wizard');
            const resultDiv = document.getElementById('dp-result');
            const leadForm = document.getElementById('dp-lead-form');
            const adminToggle = document.getElementById('dp-admin-toggle');
            const adminPanel = document.getElementById('dp-admin-panel');
            const aiResponseP = document.getElementById('dp-ai-response');

            let currentStep = 0;
            const userAnswers = {};

            const steps = [
                {
                    question: "اندازه کسب و کار شما چیست؟",
                    options: ["کسب و کار کوچک (1-10 نفر)", "کسب و کار متوسط (11-50 نفر)", "سازمان بزرگ (بیش از 50 نفر)"],
                    key: "businessSize"
                },
                {
                    question: "کدام یک از حوزه های زیر برای شما اولویت دارد؟",
                    options: ["مدیریت ارتباط با مشتری (CRM)", "پشتیبانی و خدمات پس از فروش", "مدیریت پروژه ها", "اتوماسیون فرآیندهای داخلی", "مدیریت مالی و حسابداری"],
                    key: "priorityArea"
                },
                {
                    question: "آیا به راهکاری برای مدیریت نیروهای انسانی و فرآیندهای جذب و استخدام نیاز دارید؟",
                    options: ["بله", "خیر"],
                    key: "hrNeeded"
                },
                {
                    question: "آیا نیاز به اتصال نرم افزار به سیستم های دیگر (مانند وبسایت، اپلیکیشن، حسابداری و...) دارید؟",
                    options: ["بله، حتما", "شاید در آینده", "خیر"],
                    key: "apiNeeded"
                }
            ];

            function showStep(stepIndex) {
                const step = steps[stepIndex];
                wizard.innerHTML = `
                    <div class="dp-step active">
                        <h3>مرحله ${stepIndex + 1} از ${steps.length}</h3>
                        <p>${step.question}</p>
                        <div class="dp-options">
                            ${step.options.map((option, index) => `
                                <label>
                                    <input type="radio" name="step${stepIndex}" value="${option}" data-key="${step.key}">
                                    ${option}
                                </label>
                            `).join('')}
                        </div>
                        <button class="dp-button" onclick="nextStep(${stepIndex})">${stepIndex === steps.length - 1 ? 'دریافت پیشنهاد' : 'مرحله بعد'}</button>
                    </div>
                `;
            }

            window.nextStep = function(stepIndex) {
                const selectedOption = document.querySelector(`input[name="step${stepIndex}"]:checked`);
                if (!selectedOption) {
                    alert('لطفا یک گزینه را انتخاب کنید.');
                    return;
                }
                userAnswers[selectedOption.dataset.key] = selectedOption.value;

                currentStep++;
                if (currentStep < steps.length) {
                    showStep(currentStep);
                } else {
                    wizard.style.display = 'none';
                    generatePromptAndShowResult();
                }
            }

            function generatePromptAndShowResult() {
                const prompt = `
شما یک مشاور متخصص در زمینه محصولات نرم افزاری داناپرداز هستید. مشتری با مشخصات زیر به شما مراجعه کرده است:
- اندازه کسب و کار: ${userAnswers.businessSize}
- اولویت اصلی: ${userAnswers.priorityArea}
- نیاز به ماژول منابع انسانی: ${userAnswers.hrNeeded}
- نیاز به اتصال به سیستم های دیگر (API): ${userAnswers.apiNeeded}

با توجه به این اطلاعات، یک پیشنهاد دقیق و شخصی سازی شده به مشتری ارائه دهید. در پیشنهاد خود به موارد زیر اشاره کنید:
1.  معرفی نرم افزار اصلی که نیاز اصلی مشتری را برطرف می کند (مانند CRM، Service Desk و ...).
2.  پیشنهاد ماژول های مکمل که می تواند برای او مفید باشد.
3.  تاکید بر ارزش های افزوده داناپرداز مانند:
    - یکپارچگی و پیوستگی تمامی امکانات در یک پلتفرم (Work OS).
    - قابلیت اتصال به سایر سیستم ها از طریق API قدرتمند.
    - سادگی کاربری در عین حال قابلیت سفارشی سازی بالا.
    - اشاره به کاهش هزینه ها و افزایش بهره وری.
    - معرفی برخی از محصولات و امکانات کلیدی داناپرداز مانند: نرم‌افزار CRM، سرویس دسک، ماژول مالی و حسابداری، منابع انسانی، مدیریت پروژه، اتوماسیون اداری، ماژول های ITIL، بازاریابی، گردش کار و SLA.

لحن شما باید حرفه ای، دوستانه و متقاعد کننده باشد. خروجی باید به صورت متن ساده و بدون استفاده از مارک داون باشد.
`;
                console.log("Generated Prompt:", prompt);

                aiResponseP.innerText = "در حال پردازش و دریافت پیشنهاد از هوش مصنوعی...";
                resultDiv.style.display = 'block';

                getAiResponse(prompt).then(response => {
                    aiResponseP.innerText = response;
                    leadForm.style.display = 'block';
                }).catch(error => {
                    console.error('AI Error:', error);
                    aiResponseP.innerText = 'متاسفانه در حال حاضر امکان ارتباط با سرویس هوش مصنوعی وجود ندارد. لطفا بعدا تلاش کنید.';
                    aiResponseP.style.color = 'red';
                });
            }

            async function getAiResponse(prompt) {
                const settings = getAiSettings();
                let url = '';
                let body = {};
                const headers = {
                    'Content-Type': 'application/json'
                };

                switch (settings.provider) {
                    case 'gemini':
                        url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${settings.apiKey}`;
                        body = { contents: [{ parts: [{ text: prompt }] }] };
                        break;
                    case 'qwen':
                        url = 'https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation';
                        headers['Authorization'] = `Bearer ${settings.apiKey}`;
                        body = { model: 'qwen-turbo', input: { prompt: prompt } };
                        break;
                    case 'openrouter':
                        url = 'https://openrouter.ai/api/v1/chat/completions';
                        headers['Authorization'] = `Bearer ${settings.apiKey}`;
                        body = { model: 'google/gemini-flash-1.5', messages: [{ role: 'user', content: prompt }] };
                        break;
                    case 'custom':
                        url = settings.apiUrl;
                        headers['Authorization'] = `Bearer ${settings.apiKey}`;
                        body = { prompt: prompt }; // A generic body for custom endpoint
                        break;
                    default:
                        throw new Error('Invalid AI provider selected');
                }

                const response = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(body)
                });

                if (!response.ok) {
                    const errorBody = await response.text();
                    throw new Error(`API request failed with status ${response.status}: ${errorBody}`);
                }

                const data = await response.json();

                // Extract the response text based on the provider's structure
                switch (settings.provider) {
                    case 'gemini':
                        return data.candidates[0].content.parts[0].text;
                    case 'qwen':
                        return data.output.text;
                    case 'openrouter':
                        return data.choices[0].message.content;
                    case 'custom':
                        return data.response || data.text || JSON.stringify(data); // Generic response handling
                    default:
                        return 'پاسخ دریافت شد اما قابل پردازش نبود.';
                }
            }

            adminToggle.addEventListener('click', () => {
                adminPanel.style.display = adminPanel.style.display === 'none' ? 'block' : 'none';
            });

            const aiProviderSelect = document.getElementById('dp-ai-provider');
            const apiKeyInput = document.getElementById('dp-api-key');
            const apiUrlInput = document.getElementById('dp-api-url');
            const testConnectionBtn = document.getElementById('dp-test-connection');
            const connectionStatusP = document.getElementById('dp-connection-status');

            aiProviderSelect.addEventListener('change', function() {
                apiUrlInput.style.display = this.value === 'custom' ? 'block' : 'none';
            });

            function getAiSettings() {
                const settings = {
                    provider: localStorage.getItem('dp-ai-provider') || 'gemini',
                    apiKey: localStorage.getItem('dp-api-key') || '',
                    apiUrl: localStorage.getItem('dp-api-url') || ''
                };
                aiProviderSelect.value = settings.provider;
                apiKeyInput.value = settings.apiKey;
                apiUrlInput.value = settings.apiUrl;
                apiUrlInput.style.display = settings.provider === 'custom' ? 'block' : 'none';
                return settings;
            }

            testConnectionBtn.addEventListener('click', function() {
                const provider = aiProviderSelect.value;
                const apiKey = apiKeyInput.value;
                const apiUrl = apiUrlInput.value;

                if (!apiKey) {
                    alert('لطفا API Key را وارد کنید.');
                    return;
                }

                // Save to local storage
                localStorage.setItem('dp-ai-provider', provider);
                localStorage.setItem('dp-api-key', apiKey);
                localStorage.setItem('dp-api-url', apiUrl);

                connectionStatusP.innerText = 'در حال تست اتصال...';

                // Simulate API call for testing connection
                setTimeout(() => {
                    connectionStatusP.innerText = 'اتصال با موفقیت برقرار شد.';
                    connectionStatusP.style.color = 'green';
                }, 1000);
            });

            getAiSettings();

            const leadFormDiv = document.getElementById('dp-lead-form');
            const submitLeadBtn = document.getElementById('dp-submit-lead');

            submitLeadBtn.addEventListener('click', function() {
                const leadData = {
                    name: document.getElementById('dp-name').value,
                    email: document.getElementById('dp-email').value,
                    phone: document.getElementById('dp-phone').value,
                    needs: userAnswers
                };

                if (!leadData.name || !leadData.email) {
                    alert('لطفا نام و ایمیل خود را وارد کنید.');
                    return;
                }

                console.log('Lead Data:', leadData); // Simulate sending data to server

                leadFormDiv.innerHTML = '<h3>از اینکه به ما اعتماد کردید سپاسگزاریم!</h3><p>کارشناسان ما به زودی با شما تماس خواهند گرفت.</p>';
            });

            showStep(currentStep);
        });
    </script>
</body>
</html>
