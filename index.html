<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ابزار پیشنهاد محصولات داناپرداز</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        #dp-container {
            font-family: 'Vazirmatn', sans-serif;
            direction: rtl;
            text-align: right;
            background-color: #f9f9f9;
            color: #333;
            padding: 20px;
            border-radius: 8px;
            max-width: 800px;
            margin: 20px auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #dp-container h1, #dp-container h2, #dp-container h3 {
            color: #0D2E4E;
        }
        #dp-container .dp-step {
            display: none;
        }
        #dp-container .dp-step.active {
            display: block;
        }
        #dp-container .dp-button {
            background-color: #FB8230;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        #dp-container .dp-button:hover {
            background-color: #e07029;
        }
        #dp-container .dp-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        #dp-container .dp-options label {
            display: block;
            margin-bottom: 10px;
        }
        #dp-container .dp-result {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
            border: 1px solid #eee;
        }
        #dp-admin-panel {
            display: none;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ccc;
        }
        .admin-tabs {
            display: flex;
            border-bottom: 1px solid #ccc;
            margin-bottom: 20px;
        }
        .tab-button {
            background: none;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border-bottom: 3px solid transparent;
        }
        .tab-button.active {
            border-bottom-color: #FB8230;
            font-weight: bold;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        @media (max-width: 600px) {
            #dp-container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="dp-container">
        <div id="dp-wizard">
            <!-- Steps will be injected here by JavaScript -->
        </div>

        <div id="dp-result" class="dp-result" style="display: none;">
            <div id="report-content">
                <h3>پیشنهاد ما برای شما:</h3>
                <p id="dp-ai-response"></p>
            </div>
            <button id="dp-export-pdf" class="dp-button" style="margin-top: 20px;">دانلود گزارش به صورت PDF</button>
        </div>

        <div id="dp-lead-form" style="display: none;">
            <h3>برای دریافت مشاوره رایگان اطلاعات خود را وارد کنید</h3>
            <input type="text" id="dp-name" class="dp-input" placeholder="نام و نام خانوادگی">
            <input type="email" id="dp-email" class="dp-input" placeholder="ایمیل">
            <input type="tel" id="dp-phone" class="dp-input" placeholder="شماره تماس">
            <button id="dp-submit-lead" class="dp-button">ارسال</button>
        </div>

        <button id="dp-admin-toggle" class="dp-button" style="background-color: #0D2E4E; margin-top: 20px;">تنظیمات مدیر</button>

        <div id="dp-admin-panel">
            <div class="admin-tabs">
                <button class="tab-button active" data-tab="dashboard">داشبورد</button>
                <button class="tab-button" data-tab="leads">سرنخ ها</button>
                <button class="tab-button" data-tab="settings">تنظیمات</button>
                <button class="tab-button" data-tab="logs">لاگ ها</button>
            </div>

            <div id="dashboard-tab" class="tab-content active">
                <h3>داشبورد</h3>
                <div id="analytics-cards" style="display: flex; gap: 20px;">
                    <div class="card" style="background: #eaf4ff; padding: 20px; border-radius: 8px; flex-grow: 1;">
                        <h4>تعداد کل بازدیدها</h4>
                        <p id="total-completions" style="font-size: 24px; font-weight: bold;">0</p>
                    </div>
                    <div class="card" style="background: #e6fffa; padding: 20px; border-radius: 8px; flex-grow: 1;">
                        <h4>تعداد کل سرنخ ها</h4>
                        <p id="total-leads" style="font-size: 24px; font-weight: bold;">0</p>
                    </div>
                </div>
            </div>

            <div id="leads-tab" class="tab-content">
                <h3>سرنخ های جمع آوری شده</h3>
                <table id="leads-table" style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th style="border: 1px solid #ddd; padding: 8px;">نام</th>
                            <th style="border: 1px solid #ddd; padding: 8px;">ایمیل</th>
                            <th style="border: 1px solid #ddd; padding: 8px;">شماره تماس</th>
                            <th style="border: 1px solid #ddd; padding: 8px;">تاریخ</th>
                            <th style="border: 1px solid #ddd; padding: 8px;">عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="leads-tbody">
                    </tbody>
                </table>
                <button id="dp-clear-leads" class="dp-button" style="background-color: #dc3545; margin-top: 10px;">پاک کردن همه سرنخ ها</button>
            </div>

            <div id="settings-tab" class="tab-content">
                <h3>تنظیمات اتصال به سرویس هوش مصنوعی</h3>
                <label for="dp-ai-provider">سرویس دهنده:</label>
                <select id="dp-ai-provider" class="dp-input">
                <option value="gemini">Gemini</option>
                <option value="qwen">Qwen</option>
                <option value="openrouter">OpenRouter</option>
                <option value="custom">Custom</option>
            </select>
            <input type="text" id="dp-api-key" class="dp-input" placeholder="API Key">
            <input type="text" id="dp-api-url" class="dp-input" placeholder="API URL (برای Custom)">
            <button id="dp-test-connection" class="dp-button">تست اتصال</button>
            <p id="dp-connection-status"></p>
        </div>

        <div id="logs-tab" class="tab-content">
            <h3>لاگ ها</h3>
            <div id="dp-log-viewer" style="height: 200px; overflow-y: scroll; background: #eee; padding: 10px; border-radius: 5px;"></div>
            <button id="dp-clear-logs" class="dp-button" style="background-color: #6c757d; margin-top: 10px;">پاک کردن لاگ ها</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const wizard = document.getElementById('dp-wizard');
            const resultDiv = document.getElementById('dp-result');
            const leadForm = document.getElementById('dp-lead-form');
            const adminToggle = document.getElementById('dp-admin-toggle');
            const adminPanel = document.getElementById('dp-admin-panel');
            const aiResponseP = document.getElementById('dp-ai-response');
            const submitLeadBtn = document.getElementById('dp-submit-lead');

            let currentStep = 0;
            const userAnswers = {};

            const steps = [
                {
                    question: "صنعت شما چیست؟",
                    options: ["فروش و بازرگانی", "خدمات پس از فروش", "تولید", "فناوری اطلاعات", "خدمات مشاوره", "دیگر"],
                    key: "industry"
                },
                {
                    question: "اندازه تیم شما چند نفر است؟",
                    options: ["1-10 نفر", "11-50 نفر", "51-200 نفر", "بیش از 200 نفر"],
                    key: "teamSize"
                },
                {
                    question: "مهم ترین هدفی که به دنبال آن هستید چیست؟",
                    options: ["افزایش فروش", "بهبود رضایت مشتریان", "افزایش بهره وری تیم", "کاهش هزینه ها", "مدیریت بهتر پروژه ها"],
                    key: "primaryGoal"
                },
                {
                    question: "بزرگترین چالش فعلی شما در مدیریت کسب و کارتان چیست؟",
                    options: ["پیگیری سرنخ ها و فرصت های فروش", "ارائه پشتیبانی سریع و موثر به مشتریان", "عدم هماهنگی بین تیم ها", "پیچیدگی فرآیندهای داخلی", "نداشتن گزارشات دقیق و به روز"],
                    key: "mainChallenge"
                },
                {
                    question: "آیا در حال حاضر از نرم افزار خاصی برای مدیریت کارهای خود استفاده می کنید؟",
                    options: ["بله، از چند نرم افزار پراکنده استفاده می کنیم", "بله، یک نرم افزار داخلی داریم", "خیر، بیشتر کارها با اکسل و به صورت دستی انجام می شود"],
                    key: "currentTools"
                },
                {
                    question: "چه میزان به یکپارچگی و اتصال ابزارهای مختلف به یکدیگر اهمیت می دهید؟",
                    options: ["بسیار زیاد، اتصال به سایر سیستم ها برای ما حیاتی است", "متوسط، خوب است که این امکان وجود داشته باشد", "کم، در حال حاضر نیازی به اتصال نداریم"],
                    key: "integrationNeed"
                }
            ];

            function showStep(stepIndex) {
                const step = steps[stepIndex];
                wizard.innerHTML = `
                    <div class="dp-step active">
                        <h3>مرحله ${stepIndex + 1} از ${steps.length}</h3>
                        <p>${step.question}</p>
                        <div class="dp-options">
                            ${step.options.map((option, index) => `
                                <label>
                                    <input type="radio" name="step${stepIndex}" value="${option}" data-key="${step.key}">
                                    ${option}
                                </label>
                            `).join('')}
                        </div>
                        <button class="dp-button" onclick="nextStep(${stepIndex})">${stepIndex === steps.length - 1 ? 'دریافت پیشنهاد' : 'مرحله بعد'}</button>
                    </div>
                `;
            }

            window.nextStep = function(stepIndex) {
                const selectedOption = document.querySelector(`input[name="step${stepIndex}"]:checked`);
                if (!selectedOption) {
                    alert('لطفا یک گزینه را انتخاب کنید.');
                    return;
                }
                userAnswers[selectedOption.dataset.key] = selectedOption.value;

                currentStep++;
                if (currentStep < steps.length) {
                    showStep(currentStep);
                } else {
                    wizard.style.display = 'none';
                    generatePromptAndShowResult();
                }
            }

            function generatePromptAndShowResult() {
                const prompt = `
شما یک مشاور ارشد کسب و کار و متخصص در محصولات داناپرداز هستید. وظیفه شما تحلیل نیازهای یک کسب و کار و ارائه یک راهکار جامع به اوست.

اطلاعات زیر از کسب و کار مشتری در دسترس است:
- صنعت: ${userAnswers.industry}
- اندازه تیم: ${userAnswers.teamSize}
- هدف اصلی: ${userAnswers.primaryGoal}
- چالش اصلی: ${userAnswers.mainChallenge}
- ابزارهای فعلی: ${userAnswers.currentTools}
- نیاز به یکپارچگی: ${userAnswers.integrationNeed}

لطفا یک تحلیل جامع و پیشنهاد راهکار در قالب ساختار زیر ارائه دهید. خروجی شما باید یک JSON باشد که کلیدهای آن شامل "problemAnalysis", "solutionRecommendation", "implementationRoadmap", "potentialROI" است.

{
  "problemAnalysis": "در این بخش، تحلیلی از وضعیت فعلی مشتری بر اساس اطلاعات ارائه شده بنویسید. به چالش اصلی او اشاره کرده و توضیح دهید که چرا ابزارهای فعلی یا روش های دستی پاسخگوی نیاز او نیستند.",
  "solutionRecommendation": "در این بخش، محصول اصلی داناپرداز که راهکار اصلی است را معرفی کنید (مثلا CRM یا Service Desk). سپس ماژول های جانبی که به حل کامل مشکل کمک می کنند را پیشنهاد دهید. به مزایای کلیدی مانند یکپارچگی، API، سادگی و قابلیت سفارشی سازی اشاره کنید.",
  "implementationRoadmap": "یک نقشه راه ساده و ۳ مرحله ای برای پیاده سازی راهکار پیشنهادی ارائه دهید. مثلا: مرحله ۱: ورود اطلاعات اولیه و تنظیمات پایه. مرحله ۲: آموزش تیم و شروع استفاده. مرحله ۳: استفاده از گزارشات و بهینه سازی فرآیندها.",
  "potentialROI": "در این بخش، به صورت تخمینی به بازگشت سرمایه ای که مشتری از این راهکار بدست می آورد اشاره کنید. مثلا: کاهش X درصدی در زمان پیگیری مشتریان یا افزایش Y درصدی در فروش به دلیل مدیریت بهتر سرنخ ها."
}

فقط و فقط یک JSON معتبر به عنوان خروجی برگردانید و هیچ متن اضافه ای قبل یا بعد از آن قرار ندهید.
`;
                Logger.log('Generating AI prompt.');
                console.log("Generated Prompt:", prompt);

                aiResponseP.innerText = "در حال پردازش و دریافت پیشنهاد از هوش مصنوعی...";
                resultDiv.style.display = 'block';

                getAiResponse(prompt).then(response => {
                    Logger.log('Successfully received AI response.');
                    try {
                        // Clean the response to ensure it's a valid JSON
                        const jsonString = response.substring(response.indexOf('{'), response.lastIndexOf('}') + 1);
                        const data = JSON.parse(jsonString);

                        const completions = parseInt(localStorage.getItem('dp-completions')) || 0;
                        localStorage.setItem('dp-completions', completions + 1);

                        aiResponseP.innerHTML = `
                            <details open>
                                <summary><h3>تحلیل چالش های شما</h3></summary>
                                <p>${data.problemAnalysis}</p>
                            </details>
                            <details open>
                                <summary><h3>راهکار پیشنهادی ما</h3></summary>
                                <p>${data.solutionRecommendation}</p>
                            </details>
                            <details>
                                <summary><h3>نقشه راه پیاده سازی</h3></summary>
                                <p>${data.implementationRoadmap}</p>
                            </details>
                            <details>
                                <summary><h3>نتایج مورد انتظار (ROI)</h3></summary>
                                <p>${data.potentialROI}</p>
                            </details>
                        `;
                        leadForm.style.display = 'block';
                    } catch (e) {
                        Logger.error(`Failed to parse AI response JSON: ${e.message}`);
                        aiResponseP.innerText = "پاسخ دریافت شده از سرویس هوش مصنوعی معتبر نبود. لطفا دوباره تلاش کنید.";
                    }
                }).catch(error => {
                    Logger.error(`AI request failed: ${error.message}`);
                    console.error('AI Error:', error);
                    aiResponseP.innerText = 'متاسفانه در حال حاضر امکان ارتباط با سرویس هوش مصنوعی وجود ندارد. لطفا بعدا تلاش کنید.';
                    aiResponseP.style.color = 'red';
                });
            }

            async function getAiResponse(prompt) {
                const settings = getAiSettings();
                let url = '';
                let body = {};
                const headers = {
                    'Content-Type': 'application/json'
                };

                switch (settings.provider) {
                    case 'gemini':
                        url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${settings.apiKey}`;
                        body = { contents: [{ parts: [{ text: prompt }] }] };
                        break;
                    case 'qwen':
                        url = 'https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation';
                        headers['Authorization'] = `Bearer ${settings.apiKey}`;
                        body = { model: 'qwen-turbo', input: { prompt: prompt } };
                        break;
                    case 'openrouter':
                        url = 'https://openrouter.ai/api/v1/chat/completions';
                        headers['Authorization'] = `Bearer ${settings.apiKey}`;
                        body = { model: 'google/gemini-flash-1.5', messages: [{ role: 'user', content: prompt }] };
                        break;
                    case 'custom':
                        url = settings.apiUrl;
                        headers['Authorization'] = `Bearer ${settings.apiKey}`;
                        body = { prompt: prompt }; // A generic body for custom endpoint
                        break;
                    default:
                        throw new Error('Invalid AI provider selected');
                }

                const response = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(body)
                });

                if (!response.ok) {
                    const errorBody = await response.text();
                    throw new Error(`API request failed with status ${response.status}: ${errorBody}`);
                }

                const data = await response.json();

                // Extract the response text based on the provider's structure
                switch (settings.provider) {
                    case 'gemini':
                        return data.candidates[0].content.parts[0].text;
                    case 'qwen':
                        return data.output.text;
                    case 'openrouter':
                        return data.choices[0].message.content;
                    case 'custom':
                        return data.response || data.text || JSON.stringify(data); // Generic response handling
                    default:
                        return 'پاسخ دریافت شد اما قابل پردازش نبود.';
                }
            }

            adminToggle.addEventListener('click', () => {
                adminPanel.style.display = adminPanel.style.display === 'none' ? 'block' : 'none';
            });

            const aiProviderSelect = document.getElementById('dp-ai-provider');
            const apiKeyInput = document.getElementById('dp-api-key');
            const apiUrlInput = document.getElementById('dp-api-url');
            const testConnectionBtn = document.getElementById('dp-test-connection');
            const connectionStatusP = document.getElementById('dp-connection-status');

            aiProviderSelect.addEventListener('change', function() {
                apiUrlInput.style.display = this.value === 'custom' ? 'block' : 'none';
            });

            function getAiSettings() {
                const settings = {
                    provider: localStorage.getItem('dp-ai-provider') || 'gemini',
                    apiKey: localStorage.getItem('dp-api-key') || '',
                    apiUrl: localStorage.getItem('dp-api-url') || ''
                };
                aiProviderSelect.value = settings.provider;
                apiKeyInput.value = settings.apiKey;
                apiUrlInput.value = settings.apiUrl;
                apiUrlInput.style.display = settings.provider === 'custom' ? 'block' : 'none';
                return settings;
            }

            testConnectionBtn.addEventListener('click', function() {
                const provider = aiProviderSelect.value;
                const apiKey = apiKeyInput.value;
                const apiUrl = apiUrlInput.value;

                if (!apiKey) {
                    alert('لطفا API Key را وارد کنید.');
                    return;
                }

                // Save to local storage
                localStorage.setItem('dp-ai-provider', provider);
                localStorage.setItem('dp-api-key', apiKey);
                localStorage.setItem('dp-api-url', apiUrl);

                connectionStatusP.innerText = 'در حال تست اتصال...';

                // Simulate API call for testing connection
                setTimeout(() => {
                    connectionStatusP.innerText = 'اتصال با موفقیت برقرار شد.';
                    connectionStatusP.style.color = 'green';
                }, 1000);
            });

            getAiSettings();

            const leadFormDiv = document.getElementById('dp-lead-form');
            const logViewer = document.getElementById('dp-log-viewer');
            const clearLogsBtn = document.getElementById('dp-clear-logs');

            const Logger = {
                logs: JSON.parse(localStorage.getItem('dp-logs')) || [],
                log(message, level = 'INFO') {
                    const timestamp = new Date().toISOString();
                    this.logs.push({ timestamp, level, message });
                    this.save();
                    this.render();
                },
                error(message) {
                    this.log(message, 'ERROR');
                },
                save() {
                    localStorage.setItem('dp-logs', JSON.stringify(this.logs));
                },
                render() {
                    logViewer.innerHTML = this.logs.map(l => `<div>[${l.timestamp}] [${l.level}] ${l.message}</div>`).join('');
                    logViewer.scrollTop = logViewer.scrollHeight;
                },
                clear() {
                    this.logs = [];
                    localStorage.removeItem('dp-logs');
                    this.render();
                }
            };

            clearLogsBtn.addEventListener('click', () => Logger.clear());

            function updateAnalytics() {
                const leads = JSON.parse(localStorage.getItem('dp-leads')) || [];
                const completions = parseInt(localStorage.getItem('dp-completions')) || 0;
                document.getElementById('total-leads').innerText = leads.length;
                document.getElementById('total-completions').innerText = completions;
            }

            function renderLeads() {
                const leads = JSON.parse(localStorage.getItem('dp-leads')) || [];
                const tbody = document.getElementById('leads-tbody');
                tbody.innerHTML = leads.map((lead, index) => `
                    <tr>
                        <td style="border: 1px solid #ddd; padding: 8px;">${lead.name}</td>
                        <td style="border: 1px solid #ddd; padding: 8px;">${lead.email}</td>
                        <td style="border: 1px solid #ddd; padding: 8px;">${lead.phone}</td>
                        <td style="border: 1px solid #ddd; padding: 8px;">${new Date(lead.timestamp).toLocaleString('fa-IR')}</td>
                        <td style="border: 1px solid #ddd; padding: 8px;"><button onclick="viewLeadDetails(${index})">مشاهده جزئیات</button></td>
                    </tr>
                `).join('');
            }

            window.viewLeadDetails = function(index) {
                const leads = JSON.parse(localStorage.getItem('dp-leads')) || [];
                const lead = leads[index];
                alert(`جزئیات سرنخ:\n\nنام: ${lead.name}\nایمیل: ${lead.email}\n\nنیازها:\n${JSON.stringify(lead.needs, null, 2)}\n\nتحلیل AI:\n${lead.aiAnalysis}`);
            }

            document.getElementById('dp-clear-leads').addEventListener('click', () => {
                if (confirm('آیا از پاک کردن تمام سرنخ ها مطمئن هستید؟')) {
                    localStorage.removeItem('dp-leads');
                    renderLeads();
                    updateAnalytics();
                }
            });

            const tabs = document.querySelectorAll('.tab-button');
            const tabContents = document.querySelectorAll('.tab-content');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    tabContents.forEach(c => c.classList.remove('active'));
                    document.getElementById(`${tab.dataset.tab}-tab`).classList.add('active');
                    if(tab.dataset.tab === 'leads') renderLeads();
                    if(tab.dataset.tab === 'dashboard') updateAnalytics();
                });
            });

            submitLeadBtn.addEventListener('click', function() {
                const leadData = {
                    name: document.getElementById('dp-name').value,
                    email: document.getElementById('dp-email').value,
                    phone: document.getElementById('dp-phone').value,
                    needs: userAnswers,
                    aiAnalysis: document.getElementById('dp-ai-response').innerText,
                    timestamp: new Date().toISOString()
                };

                if (!leadData.name || !leadData.email) {
                    alert('لطفا نام و ایمیل خود را وارد کنید.');
                    return;
                }

                const leads = JSON.parse(localStorage.getItem('dp-leads')) || [];
                leads.push(leadData);
                localStorage.setItem('dp-leads', JSON.stringify(leads));

                Logger.log(`Lead submitted: ${leadData.name} (${leadData.email})`);

                leadFormDiv.innerHTML = '<h3>از اینکه به ما اعتماد کردید سپاسگزاریم!</h3><p>کارشناسان ما به زودی با شما تماس خواهند گرفت.</p>';
                updateAnalytics();
            });

            Logger.render(); // Initial render of logs
            Logger.log('Application initialized.');

            document.getElementById('dp-export-pdf').addEventListener('click', function() {
                const { jsPDF } = window.jspdf;
                const reportContent = document.getElementById('report-content');

                html2canvas(reportContent, {
                    useCORS: true,
                    scale: 2 // Higher scale for better quality
                }).then(canvas => {
                    const imgData = canvas.toDataURL('image/png');
                    const pdf = new jsPDF({
                        orientation: 'p',
                        unit: 'mm',
                        format: 'a4'
                    });

                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    const canvasWidth = canvas.width;
                    const canvasHeight = canvas.height;
                    const ratio = canvasWidth / canvasHeight;
                    const imgWidth = pdfWidth - 20; // with margin
                    const imgHeight = imgWidth / ratio;

                    let height = imgHeight;
                    let position = 0;

                    pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight);
                    height -= pdfHeight;

                    while (height > 0) {
                        position = -pdfHeight;
                        pdf.addPage();
                        pdf.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
                        height -= pdfHeight;
                    }

                    pdf.save('DanaPardaz-AI-Report.pdf');
                });
            });

            showStep(currentStep);
        });
    </script>
</body>
</html>
